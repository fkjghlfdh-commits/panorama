<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Panorama Admin</title>
<style>
  :root {
    --bg: #fafaf7;
    --surface: #ffffff;
    --border: oklch(0.92 0.005 80);
    --border-strong: oklch(0.85 0.006 80);
    --fg: oklch(0.22 0.01 60);
    --muted: oklch(0.5 0.01 60);
    --accent: oklch(0.62 0.14 260);
    --accent-fg: #fff;
    --danger: oklch(0.6 0.16 25);
    --success: oklch(0.6 0.14 155);
    --radius: 10px;
    --shadow: 0 1px 2px rgba(20,20,30,0.04), 0 6px 24px -8px rgba(20,20,30,0.08);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--fg);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .app { max-width: 1120px; margin: 0 auto; padding: 40px 32px 80px; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 32px; }
  h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
  .tag { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .tag::before { content: ''; width: 6px; height: 6px; border-radius: 999px; background: var(--accent); }
  .sub { font-size: 13px; color: var(--muted); }

  .layout { display: grid; grid-template-columns: 360px 1fr; gap: 24px; align-items: start; }
  @media (max-width: 840px) { .layout { grid-template-columns: 1fr; } }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow);
  }
  .card h2 { font-size: 13px; font-weight: 600; margin: 0 0 14px; letter-spacing: 0.02em; text-transform: uppercase; color: var(--muted); }

  /* Upload dropzone */
  .drop {
    border: 1.5px dashed var(--border-strong);
    border-radius: var(--radius);
    padding: 32px 20px;
    text-align: center;
    transition: border-color 120ms, background 120ms;
    cursor: pointer;
    background: oklch(0.98 0.003 80);
  }
  .drop:hover, .drop.dragging { border-color: var(--accent); background: oklch(0.97 0.02 260 / 0.4); }
  .drop svg { width: 28px; height: 28px; stroke: var(--muted); margin-bottom: 8px; }
  .drop p { margin: 4px 0; }
  .drop .primary { font-weight: 500; color: var(--fg); }
  .drop .hint { font-size: 12px; color: var(--muted); }
  input[type=file] { display: none; }

  .field { margin-top: 14px; }
  .field label { display: block; font-size: 12px; font-weight: 500; margin-bottom: 6px; color: var(--muted); }
  .field input[type=text] {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 12px;
    font: inherit;
    color: inherit;
    background: #fff;
  }
  .field input[type=text]:focus { outline: 2px solid oklch(0.62 0.14 260 / 0.25); border-color: var(--accent); }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 9px 16px; font: inherit; font-weight: 500;
    border-radius: 8px; border: 1px solid var(--border);
    background: #fff; color: var(--fg); cursor: pointer;
    transition: background 120ms, border-color 120ms, transform 60ms;
  }
  .btn:hover { border-color: var(--border-strong); }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .btn.primary:hover { background: oklch(0.55 0.15 260); border-color: oklch(0.55 0.15 260); }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
  .btn.ghost:hover { background: oklch(0.95 0.005 80); color: var(--fg); }
  .btn.danger { color: var(--danger); }
  .btn.danger:hover { background: oklch(0.97 0.03 25); }

  .row { display: flex; gap: 8px; margin-top: 14px; }
  .row .btn { flex: 1; }

  .progress {
    height: 4px; background: oklch(0.94 0.005 80);
    border-radius: 999px; overflow: hidden;
    margin-top: 12px; display: none;
  }
  .progress.show { display: block; }
  .progress > span {
    display: block; height: 100%;
    background: var(--accent);
    width: 30%;
    animation: slide 1.2s ease-in-out infinite;
  }
  @keyframes slide { 0%{ margin-left: -30%; } 100%{ margin-left: 100%; } }

  /* List */
  .empty {
    padding: 60px 20px; text-align: center; color: var(--muted);
    border: 1px dashed var(--border); border-radius: var(--radius);
  }
  .empty svg { width: 32px; height: 32px; opacity: 0.4; margin-bottom: 8px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    display: flex; flex-direction: column;
    transition: transform 160ms, box-shadow 160ms;
  }
  .item:hover { transform: translateY(-2px); box-shadow: 0 2px 4px rgba(20,20,30,0.05), 0 12px 32px -12px rgba(20,20,30,0.12); }
  .thumb {
    aspect-ratio: 2 / 1;
    background: #f0efeb center/cover no-repeat;
    position: relative;
    display: block;
  }
  .thumb::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(0deg, rgba(0,0,0,0.25), transparent 40%);
    pointer-events: none;
  }
  .item .meta { padding: 12px 14px 8px; }
  .item .name {
    font-weight: 500; font-size: 14px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .item .info { font-size: 11px; color: var(--muted); margin-top: 2px; display: flex; gap: 10px; }
  .item .actions {
    display: flex; gap: 4px; padding: 6px 8px 10px;
    border-top: 1px solid var(--border);
    margin-top: 4px;
  }
  .item .actions .btn { flex: 1; padding: 7px 10px; font-size: 12px; }

  /* Toast */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: oklch(0.22 0.01 60); color: #fff;
    padding: 10px 18px; border-radius: 999px;
    font-size: 13px; box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    opacity: 0; pointer-events: none;
    transition: opacity 200ms, transform 200ms;
    z-index: 100;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Share dialog */
  dialog {
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 0;
    max-width: 480px; width: 90%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
  }
  dialog::backdrop { background: rgba(20,20,30,0.4); backdrop-filter: blur(2px); }
  .dlg { padding: 24px; }
  .dlg h3 { margin: 0 0 6px; font-size: 16px; font-weight: 600; }
  .dlg p { margin: 0 0 16px; font-size: 13px; color: var(--muted); }
  .link-box {
    display: flex; gap: 6px;
    background: oklch(0.97 0.003 80);
    border: 1px solid var(--border);
    border-radius: 8px; padding: 4px;
  }
  .link-box input {
    flex: 1; border: none; background: transparent;
    font: inherit; font-family: 'SF Mono', Menlo, monospace;
    font-size: 12px; padding: 8px 10px; color: var(--fg);
    outline: none;
  }
  .warn {
    margin-top: 14px; padding: 10px 12px;
    background: oklch(0.97 0.03 80); border: 1px solid oklch(0.9 0.05 80);
    border-radius: 8px; font-size: 12px; color: oklch(0.4 0.08 60);
    line-height: 1.5;
  }
  .warn strong { font-weight: 600; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <div class="tag">Admin</div>
      <h1 style="margin-top:6px">파노라마 관리</h1>
      <div class="sub">이미지를 업로드하고 공유 링크를 생성하세요</div>
    </div>
    <a href="View.html" class="btn ghost" target="_blank" rel="noopener">뷰어 열기 →</a>
  </header>

  <div class="layout">
    <!-- Upload panel -->
    <aside>
      <div class="card">
        <h2>업로드</h2>
        <label class="drop" id="drop">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 15V3m0 0l-4 4m4-4l4 4"/>
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          </svg>
          <p class="primary">파일을 끌어놓거나 클릭</p>
          <p class="hint">Equirectangular JPG/PNG · 2:1 비율 권장</p>
          <input type="file" id="file" accept="image/*" />
        </label>

        <div class="field">
          <label for="name">이름 (선택)</label>
          <input type="text" id="name" placeholder="예: 1층 로비" />
        </div>

        <div class="progress" id="progress"><span></span></div>

        <div class="row">
          <button class="btn primary" id="save" disabled>저장</button>
          <button class="btn" id="clear">지우기</button>
        </div>
      </div>
    </aside>

    <!-- List -->
    <main>
      <div id="list-wrap"></div>
    </main>
  </div>
</div>

<dialog id="share-dialog">
  <div class="dlg">
    <h3>공유 링크 생성됨</h3>
    <p>아래 링크를 복사해서 공유하세요. 링크를 받은 사람은 파노라마를 볼 수만 있습니다.</p>
    <div class="link-box">
      <input type="text" id="share-url" readonly />
      <button class="btn primary" id="copy-btn">복사</button>
    </div>
    <div class="warn">
      <strong>알림</strong> — 이 프로토타입은 서버가 없어 이미지가 이 브라우저에만 저장됩니다.
      실제 서비스라면 이미지 업로드 시 클라우드에 저장되고 링크로 어디서든 접근할 수 있게 됩니다.
    </div>
    <div class="row">
      <button class="btn" id="open-viewer">뷰어에서 열기</button>
      <button class="btn ghost" id="close-dlg">닫기</button>
    </div>
  </div>
</dialog>

<div class="toast" id="toast"></div>

<script src="panorama-store.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const drop = $('drop');
  const fileInput = $('file');
  const nameInput = $('name');
  const saveBtn = $('save');
  const clearBtn = $('clear');
  const progress = $('progress');
  const listWrap = $('list-wrap');
  const shareDlg = $('share-dialog');
  const shareUrl = $('share-url');
  const copyBtn = $('copy-btn');
  const closeDlg = $('close-dlg');
  const openViewer = $('open-viewer');
  const toastEl = $('toast');

  let pendingFile = null;

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => toastEl.classList.remove('show'), 2000);
  }

  function fmtSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
    return (bytes/1024/1024).toFixed(1) + ' MB';
  }
  function fmtDate(ts) {
    const d = new Date(ts);
    const now = new Date();
    const sameDay = d.toDateString() === now.toDateString();
    if (sameDay) return d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
    return d.toLocaleDateString('ko-KR', { month: 'short', day: 'numeric' });
  }

  // Dropzone events
  drop.addEventListener('click', (e) => {
    if (e.target === fileInput) return;
    fileInput.click();
  });
  drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('dragging'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('dragging'));
  drop.addEventListener('drop', (e) => {
    e.preventDefault();
    drop.classList.remove('dragging');
    const f = e.dataTransfer.files[0];
    if (f) selectFile(f);
  });
  fileInput.addEventListener('change', () => {
    const f = fileInput.files[0];
    if (f) selectFile(f);
  });

  function selectFile(f) {
    if (!f.type.startsWith('image/')) {
      toast('이미지 파일만 업로드할 수 있습니다');
      return;
    }
    pendingFile = f;
    saveBtn.disabled = false;
    const dropPrimary = drop.querySelector('.primary');
    const dropHint = drop.querySelector('.hint');
    dropPrimary.textContent = f.name;
    dropHint.textContent = fmtSize(f.size);
    if (!nameInput.value) nameInput.value = f.name.replace(/\.[^.]+$/, '');
  }

  clearBtn.addEventListener('click', reset);
  function reset() {
    pendingFile = null;
    fileInput.value = '';
    nameInput.value = '';
    saveBtn.disabled = true;
    drop.querySelector('.primary').textContent = '파일을 끌어놓거나 클릭';
    drop.querySelector('.hint').textContent = 'Equirectangular JPG/PNG · 2:1 비율 권장';
  }

  saveBtn.addEventListener('click', async () => {
    if (!pendingFile) return;
    saveBtn.disabled = true;
    clearBtn.disabled = true;
    progress.classList.add('show');
    try {
      const thumb = await PanoramaStore.makeThumbnail(pendingFile);
      const id = await PanoramaStore.savePanorama({
        name: nameInput.value.trim() || pendingFile.name,
        blob: pendingFile,
        thumbBlob: thumb,
      });
      await render();
      showShare(id);
      reset();
    } catch (err) {
      console.error(err);
      toast('저장 실패: ' + err.message);
    } finally {
      progress.classList.remove('show');
      clearBtn.disabled = false;
    }
  });

  function shareUrlFor(id) {
    const base = location.href.replace(/[^/]*$/, '');
    return base + 'View.html?id=' + encodeURIComponent(id);
  }

  function showShare(id) {
    shareUrl.value = shareUrlFor(id);
    openViewer.onclick = () => window.open(shareUrl.value, '_blank');
    shareDlg.showModal();
    setTimeout(() => { shareUrl.select(); }, 50);
  }
  copyBtn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(shareUrl.value);
      copyBtn.textContent = '복사됨';
      setTimeout(() => copyBtn.textContent = '복사', 1500);
    } catch {
      shareUrl.select(); document.execCommand('copy');
      copyBtn.textContent = '복사됨';
      setTimeout(() => copyBtn.textContent = '복사', 1500);
    }
  });
  closeDlg.addEventListener('click', () => shareDlg.close());

  async function render() {
    const items = await PanoramaStore.listPanoramas();
    if (items.length === 0) {
      listWrap.innerHTML = `
        <div class="empty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="1.5"/><path d="M21 15l-5-5-9 9"/></svg>
          <div>아직 업로드된 파노라마가 없습니다</div>
        </div>`;
      return;
    }
    listWrap.innerHTML = `<div class="grid" id="grid"></div>`;
    const grid = document.getElementById('grid');
    for (const item of items) {
      const thumbUrl = item.thumbBlob ? URL.createObjectURL(item.thumbBlob) : '';
      const card = document.createElement('div');
      card.className = 'item';
      card.innerHTML = `
        <a class="thumb" style="background-image:url('${thumbUrl}')" href="View.html?id=${encodeURIComponent(item.id)}" target="_blank" rel="noopener" title="뷰어에서 열기"></a>
        <div class="meta">
          <div class="name">${escapeHtml(item.name)}</div>
          <div class="info"><span>${fmtSize(item.size)}</span><span>${fmtDate(item.createdAt)}</span></div>
        </div>
        <div class="actions">
          <button class="btn" data-share="${item.id}">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
            공유
          </button>
          <button class="btn danger" data-delete="${item.id}">삭제</button>
        </div>
      `;
      grid.appendChild(card);
    }
    grid.querySelectorAll('[data-share]').forEach((b) => {
      b.addEventListener('click', () => showShare(b.dataset.share));
    });
    grid.querySelectorAll('[data-delete]').forEach((b) => {
      b.addEventListener('click', async () => {
        if (!confirm('정말 삭제할까요?')) return;
        await PanoramaStore.deletePanorama(b.dataset.delete);
        toast('삭제되었습니다');
        render();
      });
    });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  }

  render();
})();
</script>
</body>
</html>
